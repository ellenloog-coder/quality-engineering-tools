<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>知识星球 | Blendex Labs</title>
  <style>
    :root{--ink:#14171c;--muted:#68707b;--line:#e5e7eb;--soft:#f6f7f9;--accent:#111827}
    *{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    .wrap{width:min(1120px,calc(100% - 40px));margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0}.brand{font-weight:800;font-size:20px}.brand a{color:inherit;text-decoration:none}.switch{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}
    main{padding:58px 0 80px}.eyebrow{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{max-width:760px;margin:14px 0 12px;font-size:clamp(34px,6vw,66px);line-height:1.03;letter-spacing:-.05em}.hero p{max-width:680px;color:var(--muted);font-size:17px;line-height:1.7}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}.card{display:block;min-height:190px;padding:24px;border:1px solid var(--line);border-radius:20px;background:#fff;color:inherit;text-decoration:none;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(17,24,39,.1)}.card h2{margin:0 0 10px;font-size:20px}.card p{margin:0;color:var(--muted);line-height:1.6}.tag{display:inline-block;margin-bottom:28px;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:11px;font-weight:800}
    .support{margin-top:16px}.footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.footer a{color:inherit}
    @media(max-width:760px){.wrap{width:min(100% - 28px,560px)}main{padding-top:35px}.grid{grid-template-columns:1fr;margin-top:32px}.hero p{font-size:15px}}
  </style>
</head>
<body>
  <header class="wrap top"><div class="brand"><a href="/">Blendex Labs</a></div><button class="switch" id="languageBtn" type="button">English</button></header>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow" data-en="Planet / Knowledge Base">知识星球 / Planet · Knowledge Base</div>
      <h1 data-en="Practical knowledge for better engineering decisions">帮助工程团队做出更好决策的实用知识</h1>
      <p data-en="Methodology, engineering practice, cases, and support resources for quality professionals.">面向质量专业人员的方法论、工程实践、案例与支持资源。</p>
    </section>
    <section class="grid" aria-label="Knowledge categories">
      <a class="card" id="methodology" href="#methodology"><span class="tag" data-en="Knowledge Base">知识星球</span><h2 data-en="Methodology &amp; Standards">方法论与标准解读</h2><p data-en="Clear explanations of quality methods, standards, and decision logic.">清晰解释质量方法、标准要求与决策逻辑。</p></a>
      <a class="card" id="engineering" href="#engineering"><span class="tag" data-en="Knowledge Base">知识星球</span><h2 data-en="Engineering Best Practices">工程最佳实践</h2><p data-en="Practical workflows, checklists, and controls that teams can apply.">可直接应用的工程流程、检查清单与控制方法。</p></a>
      <a class="card" id="cases" href="#cases"><span class="tag" data-en="Knowledge Base">知识星球</span><h2 data-en="Cases &amp; Clinic">案例与诊所</h2><p data-en="Realistic problem-solving cases with evidence-based discussion.">基于证据讨论真实感问题解决案例。</p></a>
    </section>
    <section class="grid support" id="support" aria-label="Support categories">
      <a class="card" id="help" href="#help"><span class="tag" data-en="Support">支持</span><h2 data-en="Help Center">帮助中心</h2><p data-en="Guides for using Blendex Labs tools and publishing your work.">Blendex Labs 工具使用与内容发布指南。</p></a>
      <a class="card" id="statistics" href="#statistics"><span class="tag" data-en="Support">支持</span><h2 data-en="Statistics &amp; Algorithm Notes">统计与算法说明</h2><p data-en="Transparent notes on calculations, assumptions, and interpretation limits.">说明计算、假设与结果解读边界。</p></a>
    </section>
    <div class="footer"><a href="/">← <span data-en="Back to Blendex Labs">返回 Blendex Labs</span></a></div>
  </main>
  <script>
    (()=>{const button=document.getElementById('languageBtn');let en=false;button.addEventListener('click',()=>{en=!en;document.documentElement.lang=en?'en':'zh-CN';document.querySelectorAll('[data-en]').forEach(el=>{if(!el.dataset.zh)el.dataset.zh=el.innerHTML;el.innerHTML=en?el.dataset.en:el.dataset.zh});button.textContent=en?'中文':'English';document.title=en?'Planet / Knowledge Base | Blendex Labs':'知识星球 | Blendex Labs'})})();
  </script>
</body>
</html>
